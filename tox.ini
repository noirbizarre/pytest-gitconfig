# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py3{10,11,12,13,14},report
requires = tox>=4.22
setenv =
  COVERAGE_FILE = {toxworkdir}/coverage

[testenv]
dependency_groups = test
commands =
  coverage run --append -m pytest {posargs} --junitxml=reports/tests.{envname}.xml

[testenv:report]
deps = coverage
skip_install = true
parallel_show_output = true
depends = py3{10,11,12,13,14}
commands =
    coverage report
    coverage xml -o reports/tox/coverage.xml
    coverage html -d reports/tox/coverage
